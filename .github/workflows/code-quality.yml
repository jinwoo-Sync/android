name: Code Quality Check

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write
    
jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      
    - name: Check for hardcoded secrets
      run: |
        if grep -r "api_key\|password\|secret\|token" \
          --include="*.kt" --include="*.java" \
          --exclude-dir=build \
          --exclude-dir=.gradle \
          app/src/main | \
          grep -v "// TODO\|// FIXME\|* @param"; then
          echo "::warning::Possible hardcoded secrets found. Please review."
        fi
        
    - name: Count TODO/FIXME comments
      run: |
        TODO_COUNT=$(grep -r "TODO\|FIXME" \
          --include="*.kt" --include="*.java" \
          --exclude-dir=build \
          app/src | wc -l)
        echo "Found $TODO_COUNT TODO/FIXME comments"
        echo "::notice::Found $TODO_COUNT TODO/FIXME comments in the codebase"
        
    - name: Check code formatting
      run: |
        ./gradlew ktlintCheck || true
        
    - name: Analyze code complexity
      run: |
        ./gradlew detekt || true
        
    - name: Memory leak analysis warning
      run: |
        echo "::notice::Remember to check LeakCanary reports for memory leaks in debug builds"
        
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      
    - name: Run tests with coverage
      run: |
        ./gradlew testDebugUnitTestCoverage || ./gradlew test
        
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: app/build/reports/coverage/
        
    - name: Comment PR with coverage
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const issue_number = context.issue.number;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          
          github.rest.issues.createComment({
            owner,
            repo,
            issue_number,
            body: '✅ Tests completed. Check artifacts for detailed coverage report.'
          });